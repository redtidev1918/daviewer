name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        # Retry pub get to ride out pub.dev CDN propagation lag for freshly
        # published DAKit versions (a stale edge can briefly report them as
        # missing and fail the build).
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              exit 0
            fi
            echo "::warning::flutter pub get failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Analyze
        run: flutter analyze
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Test
        run: flutter test

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        # Retry pub get to ride out pub.dev CDN propagation lag for freshly
        # published DAKit versions (a stale edge can briefly report them as
        # missing and fail the build).
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              exit 0
            fi
            echo "::warning::flutter pub get failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Set up signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PROPERTIES: ${{ secrets.KEYSTORE_PROPERTIES }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PROPERTIES" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > android/app/upload-keystore.p12
            echo "$KEYSTORE_PROPERTIES" > android/key.properties
            echo "Release signing enabled."
          else
            echo "::error::KEYSTORE_B64 / KEYSTORE_PROPERTIES secrets are required for release builds."
            echo "Refusing to publish a debug-signed release APK because it would not install over previous upload-signed releases."
            exit 1
          fi
      - name: Build release APK
        run: flutter build apk --release
      - name: Rename APK with version
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/DAViewer-$VERSION.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daviewer-android-apk
          path: build/app/outputs/flutter-apk/DAViewer-*.apk
          if-no-files-found: error

  build-macos:
    name: Build macOS app
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        # Retry pub get to ride out pub.dev CDN propagation lag for freshly
        # published DAKit versions (a stale edge can briefly report them as
        # missing and fail the build).
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              exit 0
            fi
            echo "::warning::flutter pub get failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Build release app
        run: flutter build macos --release
      - name: Validate and launch macOS app
        run: |
          APP_PATH="build/macos/Build/Products/Release/DAViewer.app"
          APP_EXEC="$APP_PATH/Contents/MacOS/DAViewer"

          # Flutter/Xcode may inject development entitlements into an ad-hoc
          # signature. Re-sign the outer bundle from the checked-in release
          # entitlement file so a restricted empty keychain group cannot make
          # launchd kill the downloaded app before main() runs.
          codesign --force --sign - \
            --entitlements macos/Runner/Release.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          lipo -verify_arch x86_64 arm64 "$APP_EXEC"

          codesign -d --entitlements :- "$APP_PATH" \
            > "$RUNNER_TEMP/daviewer-entitlements.txt" 2>&1
          if grep -qE 'keychain-access-groups|get-task-allow' \
            "$RUNNER_TEMP/daviewer-entitlements.txt"; then
            cat "$RUNNER_TEMP/daviewer-entitlements.txt"
            echo "::error::macOS release contains development-only or invalid keychain entitlements."
            exit 1
          fi

          "$APP_EXEC" > "$RUNNER_TEMP/daviewer-smoke.log" 2>&1 &
          APP_PID=$!
          sleep 8
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            cat "$RUNNER_TEMP/daviewer-smoke.log"
            wait "$APP_PID" || true
            echo "::error::macOS app exited during the launch smoke test."
            exit 1
          fi
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true
      - name: Package app with version
        run: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d+ -f1)"
          cd build/macos/Build/Products/Release
          zip -r -y "DAViewer-$VERSION-macos.zip" DAViewer.app
      - name: Upload macOS app
        uses: actions/upload-artifact@v4
        with:
          name: daviewer-macos
          path: build/macos/Build/Products/Release/DAViewer-*-macos.zip
          if-no-files-found: error

  build-windows:
    name: Build Windows app
    # windows-2022 (VS 2022) is required: the pinned flutter_inappwebview
    # 6.1.5 still uses the deprecated /await + <experimental/coroutine>, which
    # the newer windows-latest (VS 2026 / MSVC 14.51) rejects as an error.
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true
      - name: Install dependencies
        # Retry pub get to ride out pub.dev CDN propagation lag for freshly
        # published DAKit versions (a stale edge can briefly report them as
        # missing and fail the build).
        shell: bash
        run: |
          for attempt in 1 2 3 4 5; do
            if flutter pub get; then
              exit 0
            fi
            echo "::warning::flutter pub get failed (attempt $attempt/5), retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Build release app
        run: flutter build windows --release
      - name: Package app with version
        shell: pwsh
        run: |
          $VERSION = (Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' }) -replace '^version:\s*([0-9.]+).*$', '$1'
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "DAViewer-$VERSION-windows.zip"
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: daviewer-windows
          path: DAViewer-*-windows.zip
          if-no-files-found: error

  release:
    name: GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, build-android, build-macos, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          # Collect commit messages since the previous tag for the changelog.
          PREV_TAG="$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo '')"
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG="$(git log --oneline "$PREV_TAG"..HEAD)"
          else
            CHANGELOG="$(git log --oneline -1 HEAD)"
          fi
          {
            echo "## 变更 / Changes"
            echo
            echo "$CHANGELOG" | sed 's/^/- /'
          } > release_notes.md
      - name: Delete old releases (keep only latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          for tag in $(gh release list --json tagName --jq '.[].tagName'); do
            if [ "$tag" != "${GITHUB_REF_NAME}" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "DAViewer ${{ github.ref_name }}"
          body_path: release_notes.md
          files: |
            artifacts/daviewer-android-apk/*
            artifacts/daviewer-macos/*
            artifacts/daviewer-windows/*
          fail_on_unmatched_files: true
